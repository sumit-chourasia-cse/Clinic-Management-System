<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CarePoint | Clinic Management</title>

    <link rel="stylesheet" href="home.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="container">

        <header class="brand">
            <img src="Glossy Blue Medical Cross Logo (1).png" alt="CarePoint Logo">
            <span>CarePoint</span>
        </header>

        <section class="intro">
            <h1>
                Healthcare<br>
                Management,<br>
                <span>Made Simple.</span>
            </h1>

            <div class="line"></div>

            <p>
                A complete clinic management solution to streamline care,
                save time and create better patient experiences.
            </p>
        </section>

        <section class="auth-card">

            <div class="tabs">
                <button type="button" id="login-tab" class="active">Log In</button>
                <button type="button" id="signup-tab">Sign Up</button>
            </div>

            <div class="card-heading">
                <h2 id="form-title">Welcome Back</h2>
                <p id="form-subtitle">Log in to your CarePoint account</p>
            </div>

            <form id="auth-form">

                <input type="text" id="full-name" placeholder="Full Name" hidden>

                <input type="email" id="email" placeholder="Email Address" required>

                <input type="password" id="password" placeholder="Password" minlength="6" required>

                <input type="password" id="confirm-password" placeholder="Confirm Password" hidden>

                <button type="submit" id="submit-button">
                    Log In
                </button>

                <p id="message"></p>

            </form>

            <p class="switch-text" id="switch-text">
                Don't have an account?
                <button type="button" id="switch-button">Sign Up</button>
            </p>

        </section>

    </main>

    <script src="home.js"></script>

</body>

</html>
